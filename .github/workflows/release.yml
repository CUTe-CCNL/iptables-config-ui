name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  APP_NAME: iptables-config-ui
  PNPM_VERSION: 9

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Test backend
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUT: dist/bin/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: sh scripts/build-static-linux.sh

      - name: Package service
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu

          package_name="${APP_NAME}-${TAG_NAME}-${GOOS}-${GOARCH}"
          package_dir="dist/${package_name}"
          binary_path="dist/bin/${package_name}"

          mkdir -p "${package_dir}"
          cp "${binary_path}" "${package_dir}/${APP_NAME}"
          cp README.md "${package_dir}/README.md"

          cat > "${package_dir}/${APP_NAME}.service" <<EOF
          [Unit]
          Description=iptables Config UI
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/${APP_NAME} --addr 0.0.0.0:8921
          Restart=on-failure
          RestartSec=3
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF

          tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
          (cd dist && sha256sum "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256")

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
